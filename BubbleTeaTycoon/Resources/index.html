<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffd9b3" />
  <title>珍珠奶茶店</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ============ 开始页 ============ -->
    <section id="screen-start" class="screen">
      <img src="assets/bg_shop.png" class="bg-img" alt="" />
      <div class="start-mask"></div>
      <div class="start-content">
        <img src="assets/mascot.png" class="start-mascot" alt="" />
        <h1 class="title">珍珠奶茶店</h1>
        <p class="subtitle">— 点击吧台 · 解锁设施 · 打造奶茶帝国 —</p>
        <button id="btn-start" class="btn-primary btn-lg">开始游戏</button>
        <button id="btn-start-continue" class="btn-ghost hidden">继续游戏</button>
      </div>
    </section>

    <!-- ============ 游戏主场景 ============ -->
    <section id="screen-game" class="screen hidden">
      <canvas id="canvas"></canvas>

      <!-- 顶部 HUD -->
      <div class="hud-top">
        <div class="hud-row">
          <div class="hud-pill"><img src="assets/coin.png" class="hud-ico" /><span id="hud-gold">0</span></div>
          <div class="hud-pill"><img src="assets/gem.png" class="hud-ico" /><span id="hud-gems">0</span></div>
        </div>
        <div class="hud-row">
          <div class="hud-pill ghost">
            <span class="muted">每秒</span>
            <span id="hud-rate">0</span>
            <img src="assets/coin.png" class="hud-ico-tiny" />
          </div>
        </div>
      </div>

      <!-- 右侧菜单 -->
      <div class="hud-actions">
        <button class="icon-btn" id="btn-achieve" title="成就">🏆</button>
        <button class="icon-btn" id="btn-daily" title="签到">📅</button>
        <button class="icon-btn" id="btn-settings" title="设置">⚙️</button>
      </div>

      <!-- 点击 combo 提示 -->
      <div id="combo-display" class="combo-display"></div>

      <!-- 浮动金币层 -->
      <div id="float-layer" class="float-layer"></div>

      <!-- 底部设施抽屉 -->
      <div id="drawer" class="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-title">
          <span>设施</span>
          <span id="drawer-hint" class="muted">点击设施可升级</span>
        </div>
        <div id="facility-list" class="facility-list"></div>
      </div>

      <!-- 激励广告按钮（永久占位） -->
      <button id="btn-ad" class="ad-fab" title="看广告获双倍收益">
        <img src="assets/bolt.png" class="ad-ico" />
        <span>2x</span>
      </button>

      <!-- ============ 弹窗：离线收益 ============ -->
      <div id="modal-offline" class="modal hidden">
        <div class="modal-card">
          <img src="assets/mascot.png" class="modal-mascot" />
          <h2>欢迎回来！</h2>
          <p class="muted">你离线了 <span id="offline-time">0分钟</span></p>
          <p class="reward-line">
            <span class="big-num" id="offline-gain">0</span>
            <img src="assets/coin.png" class="inline-ico" />
          </p>
          <div class="btn-row">
            <button id="offline-claim" class="btn-primary">收下</button>
            <button id="offline-double" class="btn-secondary">看广告 x2</button>
          </div>
        </div>
      </div>

      <!-- ============ 弹窗：设施详情 ============ -->
      <div id="modal-facility" class="modal hidden">
        <div class="modal-card">
          <img id="facility-detail-img" class="modal-facility-img" />
          <h2 id="facility-detail-name">设施</h2>
          <p class="muted" id="facility-detail-desc">...</p>
          <div class="stat-grid">
            <div><div class="stat-label">当前等级</div><div id="facility-detail-level">0</div></div>
            <div><div class="stat-label">每秒产出</div><div id="facility-detail-rate">0</div></div>
            <div><div class="stat-label">累计购买</div><div id="facility-detail-bought">0</div></div>
          </div>
          <div class="upgrade-row">
            <button id="facility-buy" class="btn-primary">
              <span id="facility-buy-text">购买 (+0/秒)</span>
            </button>
          </div>
          <div class="upgrade-row">
            <span class="cost-line" id="facility-cost">价格: 0</span>
          </div>
          <button id="facility-close" class="btn-ghost">关闭</button>
        </div>
      </div>

      <!-- ============ 弹窗：成就 ============ -->
      <div id="modal-achievement" class="modal hidden">
        <div class="modal-card wide">
          <h2>🏆 成就</h2>
          <div id="achievement-list" class="scroll-list"></div>
          <button class="btn-ghost modal-close">关闭</button>
        </div>
      </div>

      <!-- ============ 弹窗：签到 ============ -->
      <div id="modal-daily" class="modal hidden">
        <div class="modal-card">
          <h2>📅 每日签到</h2>
          <div id="daily-grid" class="daily-grid"></div>
          <button id="daily-claim" class="btn-primary">领取今日奖励</button>
          <button class="btn-ghost modal-close">关闭</button>
        </div>
      </div>

      <!-- ============ 弹窗：设置 ============ -->
      <div id="modal-settings" class="modal hidden">
        <div class="modal-card">
          <h2>⚙️ 设置</h2>
          <label class="setting-row">
            <span>音效</span>
            <input type="checkbox" id="set-sound" checked />
          </label>
          <label class="setting-row">
            <span>背景音乐</span>
            <input type="checkbox" id="set-bgm" />
          </label>
          <button id="set-export" class="btn-secondary">导出存档</button>
          <button id="set-import" class="btn-secondary">导入存档</button>
          <button id="set-reset" class="btn-danger">重置存档</button>
          <button class="btn-ghost modal-close">关闭</button>
        </div>
      </div>

      <!-- ============ Toast 通知 ============ -->
      <div id="toast" class="toast hidden"></div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/save.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
