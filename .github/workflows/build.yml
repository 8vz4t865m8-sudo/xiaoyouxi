name: 构建 IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: 编译 IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 App
        working-directory: ios
        run: |
          set -euxo pipefail
          xcodebuild \
            -project BubbleTeaTycoon.xcodeproj \
            -scheme BubbleTeaTycoon \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER=com.bubbleteatycoon.app \
            PRODUCT_NAME=BubbleTeaTycoon \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          echo "--- Build 完成 ---"
          ls -la build/DerivedData/Build/Products/Release-iphoneos/

      - name: 清理扩展属性并预签名
        working-directory: ios
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/BubbleTeaTycoon.app"

          # 清理可能导致重签名后校验失败的扩展属性（如 com.apple.provenance 等）
          xattr -cr "$APP"

          # 只签可执行文件本身，不加 --deep，避免把 Resources 目录下的
          # 图片/js/css 也当作待签名内容处理，导致轻松签重签时资源哈希对不上
          codesign --force --sign - "$APP"

          echo "--- 签名完成 ---"
          codesign -dv "$APP" 2>&1 | head -5
          echo "--- 签名结构验证通过 ---"

      - name: 导出 IPA
        working-directory: ios
        run: |
          set -euxo pipefail
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BubbleTeaTycoon.app build/Payload/
          xattr -cr build/Payload/BubbleTeaTycoon.app
          cd build
          zip -rX BubbleTeaTycoon.ipa Payload/
          echo "--- IPA 构建完成 ---"
          ls -la *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: BubbleTeaTycoon-IPA
          path: ios/build/BubbleTeaTycoon.ipa
          if-no-files-found: error
          retention-days: 30
