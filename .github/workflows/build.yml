name: 构建 IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: 编译 IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 App（手工编译，不走 xcodebuild）
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: BubbleTeaTycoon-IPA
          path: build/BubbleTeaTycoon.ipa
          if-no-files-found: error
          retention-days: 30
